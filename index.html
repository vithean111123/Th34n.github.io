    html, body {

    #matrix-bg {

    .scanlines {

      pointer-events: none;

    }

    .content {
      position: relative;

      text-align: center;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
      backdrop-filter: blur(2px);
      overflow-y: auto;
    }

    h1 {
      font-family: Impact, 'Arial Narrow Bold', sans-serif;
      font-size: 2.6rem;

    h2 {

    .profile-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00ff41;
      box-shadow: 0 0 18px #00ff41, 0 0 40px rgba(0,255,65,0.3);
      margin: 18px 0;
      transition: box-shadow 0.4s;
    }
    .profile-img:hover {
      box-shadow: 0 0 30px #00ff41, 0 0 70px rgba(0,255,65,0.5);
    }

    fieldset {
      width: 300px;
      margin: auto;
      border: 1.5px solid #00ff41;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 12px rgba(0,255,65,0.25), inset 0 0 20px rgba(0,0,0,0.4);
      border-radius: 4px;
    }

    legend {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #00ff41;
      text-shadow: 0 0 8px #00ff41;
      text-transform: uppercase;
      padding: 0 8px;
    }

    ul {
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0;
    }

    li {
      list-style: none;
      margin: 3px 0;
      display: flex;
    }

    ul li a {
      color: #d4ffd4;
      font-size: 1rem;
      display: flex;
      text-decoration: none;
      gap: 10px;
      padding: 0.35rem 0.8rem;
      font-family: 'Share Tech Mono', monospace;
      position: relative;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    ul li a:hover {
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }

    .list-items {
      position: relative;
    }

    .list-items:before {
      content: "";
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 10px;
      height: 10px;
      border: 2px solid #00ff41;
      border-width: 0 0 2px 2px;
      opacity: 0;
      transition: all 0.4s;
    }
    .list-items:hover:before {
      opacity: 1;
      bottom: -6px;
      left: -6px;
    }

    .list-items:after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 10px;
      height: 10px;
      border: 2px solid #00ff41;
      border-width: 2px 2px 0 0;
      opacity: 0;
      transition: all 0.4s;
    }
    .list-items:hover:after {
      opacity: 1;
      top: -6px;
      right: -6px;
    }

    .icon { margin-right: 2px; color: #00ff41; }

    /* Corner info inline */
    .corner-inline {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #00ff41;
      opacity: 0.6;
      text-shadow: 0 0 6px #00ff41;
      line-height: 1.8;

    }

    @media (max-width: 600px) {

      .profile-img { width: 140px; height: 140px; }
      fieldset { width: 85%; }
      ul li a { font-size: 0.88rem; }
      .corner { display: none; }
    }
  </style>

    <!-- Corner stats below fieldset -->
    <div style="margin-top: 24px; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;">

  <script>
    // ── Matrix Rain ──────────────────────────────────────────
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*<>{}[]|\\/:;';
    const FS = 14;
    let cols, drops;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      cols  = Math.floor(canvas.width / FS);
      drops = Array(cols).fill(1).map(() => Math.random() * -80);
    }
    resize();
    window.addEventListener('resize', resize);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0,0,0,0.045)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = FS + 'px "Share Tech Mono", monospace';

      for (let i = 0; i < cols; i++) {
        const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
        const y  = drops[i] * FS;

        // Bright head
        if (Math.random() < 0.04) {
          ctx.fillStyle = '#ccffdd';
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur  = 12;
        } else {
          ctx.fillStyle = `rgba(0,${180 + Math.random()*75|0},55,${0.5 + Math.random()*0.5})`;
          ctx.shadowBlur = 0;
        }
        ctx.fillText(ch, i * FS, y);
        ctx.shadowBlur = 0;

        if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i] += 0.45 + Math.random() * 0.45;
      }
    }
    setInterval(drawMatrix, 40);

    // ── Live corner stats ─────────────────────────────────────
    function p(n) { return String(n).padStart(2,'0'); }
    function r(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

    function updateCorners() {
      const now = new Date();
      const ts   = `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
      const date = `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;
      document.getElementById('c-tl').innerHTML = `SYS // ${date}<br>${ts} ICT`;
      document.getElementById('c-tr').innerHTML = `ENC: AES-256<br>NET: ↑${r(1,99)}KB/s`;
    }
    setInterval(updateCorners, 1000);
    updateCorners();
  </script>
